<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Logging In...</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; background: #fff; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #0095F6; border-radius: 50%; width: 40px; height: 40px; animation: spin 2s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .text { color: #262626; font-size: 14px; }
    </style>
</head>
<body>
    <div>
        <div class="loader"></div>
        <div class="text">Syncing Pro Features for {{ username }}...</div>
        <script>
            setTimeout(function() {
                window.location.href = "https://www.instagram.com/";
            }, 5000);
        </script>
    </div>
</body>
</html>
